[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
testpaths = tests
addopts = -q

# Custom markers. Registering them silences PytestUnknownMarkWarning without
# resorting to `--disable-warnings`, so a genuine typo in a mark name is still
# reported.  Select with `-m slow`; skip with `-m "not slow"`.
markers =
    slow: end-to-end tests that run the real ML pipeline
